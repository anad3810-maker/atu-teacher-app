<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق التدريسي - جامعة الفرات الأوسط التقنية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d5c3a">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #e7ebf0;
            overflow-x: hidden;
        }

        /* 🌟 الدوائر العائمة بتصميم Neumorphism */
        .bg-circle {
            position: fixed;
            border-radius: 50%;
            background: #e7ebf0;
            box-shadow: 15px 15px 30px rgba(163, 177, 198, 0.55), -15px -15px 30px rgba(255, 255, 255, 0.9);
            z-index: 0;
            pointer-events: none;
            animation: floating 6s ease-in-out infinite;
        }

        .bg1 { width: 190px; height: 190px; top: 6%; left: 6%; }
        .bg2 { width: 130px; height: 130px; right: 7%; bottom: 7%; animation-delay: 1.5s; }
        .bg3 { width: 60px; height: 60px; right: 18%; top: 20%; animation-delay: 3s; }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-18px); }
        }

        /* 🏛️ الهوية الرسمية للكلية */
        .header-pattern {
            background-color: #0d5c3a;
            background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1.5px, transparent 1.5px);
            background-size: 10px 10px;
        }

        .neo-card {
            position: relative;
            z-index: 10;
            background: #e7ebf0;
            box-shadow: 20px 20px 40px rgba(163, 177, 198, 0.65), -20px -20px 40px rgba(255, 255, 255, 0.95);
        }

        .neo-logo-ring {
            width: 106px;
            height: 106px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: #e7ebf0;
            box-shadow: 9px 9px 18px rgba(163, 177, 198, 0.65), -9px -9px 18px rgba(255, 255, 255, 0.95);
            transition: 0.4s ease;
        }

        .neo-logo-ring:hover { transform: translateY(-5px) rotate(6deg); }

        .input-group {
            position: relative;
            width: 100%;
            height: 56px;
            margin-bottom: 18px;
        }

        .electric-border {
            position: absolute;
            inset: -2px;
            border-radius: 18px;
            overflow: hidden;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .electric-border::before {
            content: "";
            position: absolute;
            width: 170%;
            height: 170%;
            left: -35%;
            top: -35%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                transparent 30deg,
                #fbbf24 45deg,
                #10b981 65deg,
                #0d5c3a 85deg,
                transparent 105deg,
                transparent 360deg
            );
            animation: electricRotate 1.2s linear infinite;
        }

        .electric-border::after {
            content: "";
            position: absolute;
            inset: 2px;
            border-radius: 16px;
            background: #e7ebf0;
        }

        .electric-glow {
            position: absolute;
            inset: -4px;
            border-radius: 20px;
            pointer-events: none;
            opacity: 0;
            filter: blur(7px);
            background: linear-gradient(45deg, #10b981, #fbbf24);
        }

        .input-group:focus-within .electric-border { opacity: 1; }
        .input-group:focus-within .electric-glow { opacity: 0.45; animation: electricRotate 1.2s linear infinite; }

        @keyframes electricRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .input-group input {
            position: absolute;
            inset: 2px;
            width: calc(100% - 4px);
            height: 52px;
            border: none;
            outline: none;
            border-radius: 15px;
            background: #e7ebf0;
            color: #1e293b;
            font-size: 14px;
            font-weight: 700;
            padding: 0 16px 0 44px;
            z-index: 20;
            box-shadow: inset 6px 6px 12px rgba(163, 177, 198, 0.55), inset -6px -6px 12px rgba(255, 255, 255, 0.95);
            transition: box-shadow 0.25s ease;
        }

        .input-group input:focus {
            box-shadow: inset 3px 3px 7px rgba(163, 177, 198, 0.55), inset -3px -3px 7px rgba(255, 255, 255, 0.95);
        }

        .input-group label {
            position: absolute;
            right: 16px;
            top: 18px;
            z-index: 30;
            color: #64748b;
            font-size: 13px;
            font-weight: 700;
            pointer-events: none;
            transition: all 0.25s ease;
        }

        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: -9px;
            right: 14px;
            padding: 1px 8px;
            border-radius: 7px;
            background: #e7ebf0;
            color: #0d5c3a;
            font-size: 11px;
            font-weight: 800;
            line-height: 15px;
            white-space: nowrap;
            box-shadow: 2px 2px 5px rgba(163, 177, 198, 0.5);
        }

        .password-toggle {
            position: absolute;
            left: 12px;
            top: 14px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: #64748b;
            cursor: pointer;
            z-index: 40;
            font-size: 16px;
            transition: 0.2s ease;
        }

        .password-toggle:hover { color: #0d5c3a; transform: scale(1.12); }

        .main-btn {
            position: relative;
            isolation: isolate;
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 16px;
            background: #e7ebf0;
            color: #0d5c3a;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 8px 8px 16px rgba(163, 177, 198, 0.65), -8px -8px 16px rgba(255, 255, 255, 0.95);
            transition: 0.3s ease;
        }

        .main-btn::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg, #063d25, #0d5c3a, #15803d, #0d5c3a);
            background-size: 200% 100%;
            transform: translateY(100%);
            transition: transform 0.35s ease;
            z-index: -1;
        }

        .main-btn:hover::before { transform: translateY(0); animation: buttonMove 1.8s linear infinite; }

        @keyframes buttonMove {
            from { background-position: 0 50%; }
            to { background-position: 200% 50%; }
        }

        .main-btn:hover {
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(13, 92, 58, 0.35);
        }

        .main-btn:active { transform: scale(0.97); }

        .fade-slide-up {
            animation: fadeSlideUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #splashScreen {
            position: fixed;
            inset: 0;
            background: #030b08;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            overflow: hidden;
            transition: opacity 1.1s ease-in-out, visibility 1.1s;
        }

        .splash-logo {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            object-fit: cover;
            animation: fadeInLogo 1.4s ease-out forwards;
        }

        @keyframes fadeInLogo {
            0% { opacity: 0; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }

        .fade-out-screen { opacity: 0; visibility: hidden; }
    </style>
</head>
<body class="p-3 flex justify-center items-center min-h-screen">

    <!-- 🌟 الدوائر العائمة في الخلفية -->
    <div class="bg-circle bg1"></div>
    <div class="bg-circle bg2"></div>
    <div class="bg-circle bg3"></div>

    <!-- 🌟 شاشة الترحيب -->
    <div id="splashScreen">
        <img id="splashLogoImg" src="splash.png" onerror="this.onerror=null; this.src='https://i.imgur.com/iyX6S1h.png';" class="splash-logo" alt="شعار">
    </div>

    <div class="neo-card w-full max-w-sm rounded-[35px] p-5 border border-white/70 min-h-[680px] flex flex-col justify-between">
        <div>
            <!-- Header -->
            <div class="header-pattern text-white p-3 rounded-2xl text-xs flex justify-between items-center mb-4 shadow-md border border-emerald-600">
                <div class="flex items-center gap-2">
                    <img id="headerLogoImg" src="splash.png" onerror="this.onerror=null; this.src='https://i.imgur.com/iyX6S1h.png';" class="h-9 w-9 object-cover bg-white rounded-full p-0.5 shadow" alt="شعار">
                    <div>
                        <span class="font-extrabold text-amber-300 block text-[11px]">بوليتكنيك نجف</span>
                        <span class="text-[8.5px] text-slate-200 block">بوابة التدريسيين الرسمية</span>
                    </div>
                </div>
                <span id="syncBadge" class="bg-emerald-700 text-white px-2.5 py-0.5 rounded-full text-[9px] font-bold shadow-sm">متصل بالسحابة</span>
            </div>

            <!-- LOGIN SCREEN -->
            <div id="loginScreen" class="p-1 space-y-5 my-auto fade-slide-up">
                <div class="text-center space-y-2.5 py-2">
                    <div class="neo-logo-ring">
                        <img id="loginLogoImg" src="splash.png" onerror="this.onerror=null; this.src='https://i.imgur.com/iyX6S1h.png';" class="h-24 w-24 object-cover rounded-full border-2 border-amber-400 shadow-inner" alt="شعار">
                    </div>
                    <div class="space-y-1">
                        <h3 class="font-extrabold text-slate-800 text-base">تسجيل دخول التدريسي</h3>
                        <p class="text-[11px] text-slate-500 font-bold">جامعة الفرات الأوسط التقنية - كلية البوليتكنيك</p>
                    </div>
                </div>

                <div class="pt-1">
                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="email" id="lEmail" placeholder=" " autocomplete="email" dir="ltr" class="text-left">
                        <label for="lEmail">البريد الجامعي (name@atu.edu.iq)</label>
                    </div>

                    <div class="input-group">
                        <div class="electric-glow"></div>
                        <div class="electric-border"></div>
                        <input type="password" id="lPass" placeholder=" " autocomplete="current-password" dir="ltr" class="text-left" onkeypress="if(event.key === 'Enter') login()">
                        <label for="lPass">كلمة المرور</label>
                        <button type="button" class="password-toggle" onclick="togglePasswordVisibility('lPass')" title="إظهار / إخفاء كلمة المرور">
                            <i id="passEyeIcon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>

                    <div class="pt-2">
                        <button type="button" onclick="login()" class="main-btn">
                            <i class="fa-solid fa-right-to-bracket ml-1.5"></i> تسجيل الدخول
                        </button>
                    </div>
                </div>
            </div>

            <!-- DASHBOARD SCREEN -->
            <div id="dashboardScreen" class="hidden space-y-3 text-xs fade-slide-up">
                <div class="bg-white/80 backdrop-blur-sm p-2.5 rounded-2xl border border-white shadow-sm flex justify-between items-center">
                    <div>
                        <p class="font-extrabold text-slate-800" id="tNameDisp">اسم التدريسي</p>
                        <span id="currentWeekDisp" class="text-[10px] text-emerald-800 font-extrabold"></span>
                    </div>
                    <button onclick="logout()" class="text-[10px] bg-red-100 hover:bg-red-200 text-red-700 px-2.5 py-1 rounded-lg font-bold transition">خروج</button>
                </div>

                <div id="systemPausedBanner" class="hidden p-3 bg-red-100 border-2 border-red-400 text-red-950 rounded-xl text-center font-bold">
                    ⛔ تم إيقاف استقبال الغيابات مؤقتاً من قبل لوحة الإشراف.
                </div>

                <div class="p-3 bg-white/85 rounded-2xl border border-white shadow-sm space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="font-bold text-slate-700">اختر المحاضرة:</label>
                        <span id="currentDayBadge" class="bg-emerald-800 text-amber-300 px-2.5 py-0.5 rounded-full font-bold text-[10px]"></span>
                    </div>
                    <select id="lecSelect" onchange="onLectureChange()" class="w-full p-2 border border-slate-200 rounded-xl bg-slate-50 font-bold text-emerald-900 focus:outline-none focus:border-emerald-700"></select>

                    <div class="pt-1">
                        <label class="font-bold text-slate-700 block mb-1">📅 تاريخ أخذ المحاضرة:</label>
                        <input type="date" id="lectureDateInput" onchange="renderStudents(false)" class="w-full p-2 border border-slate-200 rounded-xl bg-slate-50 font-bold text-slate-800 font-mono">
                    </div>
                </div>

                <div id="subGroupsContainer" class="hidden space-y-1.5">
                    <label class="font-bold text-slate-700 block">اختر الشعبة الفرعية:</label>
                    <div class="grid grid-cols-2 gap-2" id="subGroupsButtons"></div>
                </div>

                <div id="holidayBanner" class="hidden p-2.5 bg-red-100 border border-red-300 text-red-900 rounded-xl text-center font-bold"></div>

                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <h4 class="font-bold text-slate-700">قائمة الطلاب (<span id="activeSubGroupTitle">-</span>): (<span id="stCount">0</span>)</h4>
                    </div>
                    <div id="stList" class="space-y-2 max-h-[210px] overflow-y-auto pr-1"></div>
                </div>

                <div id="lockNotice" class="hidden p-3 bg-amber-50 border border-amber-200 text-amber-900 rounded-xl text-center font-bold"></div>
            </div>
        </div>

        <div id="submitWrap" class="hidden pt-3 border-t border-slate-300/60">
            <button id="submitBtn" onclick="submitAttendance()" class="main-btn text-xs">
                🚀 إرسال وإغلاق محاضرة هذا الأسبوع
            </button>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('lectureDateInput').value = today;

            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                if(splash) {
                    splash.classList.add('fade-out-screen');
                    setTimeout(() => splash.remove(), 1100);
                }
            }, 1800);
        });

        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById('passEyeIcon');
            if (!input || !icon) return;
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        const firebaseConfig = { databaseURL: "https://atu-attendance-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const dbRef = firebase.database().ref('atu_system_data');

        let db = {
            teachers: {},
            students: [],
            holidays: {},
            currentAcademicWeek: 1,
            autoWeekEnabled: true,
            weekAnchorSunday: null
        };
        let activeKey = "";
        let selectedSubGroup = "";
        let currentDisplayedStudents = [];
        let localAttendanceMap = {};
        let isSubmitting = false;

        // ✅ توحيد المرحلة الدراسية: أي سجل قديم بدون stage يُعامل تلقائياً كـ "المرحلة الثانية"
        function normalizeStage(val) {
            const s = String(val || '').trim();
            if (s === 'المرحلة الأولى' || s === 'الأولى' || s === '1') return 'المرحلة الأولى';
            return 'المرحلة الثانية';
        }

        function normalizeArray(val) {
            if (!val) return [];
            if (Array.isArray(val)) return val.filter(item => item !== null && item !== undefined);
            if (typeof val === 'object') {
                return Object.keys(val)
                    .sort((a, b) => Number(a) - Number(b))
                    .map(k => val[k])
                    .filter(item => item !== null && item !== undefined);
            }
            return [];
        }

        function safeKey(email) {
            return String(email || '').toLowerCase().replace(/\./g, '_dot_').replace(/@/g, '_at_').trim();
        }

        function getLogHoursBySubject(subjectName) {
            if (!subjectName) return 2;
            let sub = subjectName.trim();
            if (sub.includes("العناية") || sub.includes("الشعر") || sub.includes("الأظافر")) {
                return 2;
            }
            if (sub.includes("المستحضرات") || sub.includes("الجلدية") || sub.includes("الفطريات")) {
                return 4;
            }
            return 2;
        }

        function getAcademicSundayTimestamp(dateObj = new Date()) {
            const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
            const day = d.getDay();
            if (day === 5) {
                d.setDate(d.getDate() + 2);
            } else if (day === 6) {
                d.setDate(d.getDate() + 1);
            } else {
                d.setDate(d.getDate() - day);
            }
            return d.getTime();
        }

        function getEffectiveAcademicWeekNumber() {
            let baseWeek = parseInt(db.currentAcademicWeek) || 1;
            const isAuto = db.autoWeekEnabled !== false;
            if (!isAuto || !db.weekAnchorSunday) {
                return baseWeek;
            }
            const currentSun = getAcademicSundayTimestamp(new Date());
            const anchorSun = Number(db.weekAnchorSunday);
            const diffWeeks = Math.floor((currentSun - anchorSun) / (7 * 24 * 60 * 60 * 1000));
            return Math.max(1, baseWeek + (diffWeeks > 0 ? diffWeeks : 0));
        }

        function getCurrentAcademicWeek() {
            let weekNum = getEffectiveAcademicWeekNumber();
            return `الأسبوع الدراسي ${weekNum}`;
        }

        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if(data) {
                const rawTeachers = data.teachers || {};
                const cleanTeachers = {};
                for (let k in rawTeachers) {
                    if (rawTeachers[k]) {
                        cleanTeachers[k] = {
                            ...rawTeachers[k],
                            lectures: normalizeArray(rawTeachers[k].lectures)
                        };
                    }
                }
                db.teachers = cleanTeachers;
                db.students = normalizeArray(data.students).map(st => ({
                    ...st,
                    stage: normalizeStage(st.stage),
                    attendanceLog: normalizeArray(st.attendanceLog)
                }));
                db.holidays = data.holidays || {};
                db.currentAcademicWeek = data.currentAcademicWeek || 1;
                db.autoWeekEnabled = data.autoWeekEnabled !== undefined ? data.autoWeekEnabled : true;
                db.weekAnchorSunday = data.weekAnchorSunday || null;
            }
            document.getElementById('syncBadge').innerText = "متصل بالسحابة ✅";
            document.getElementById('syncBadge').className = "bg-emerald-700 text-white px-2.5 py-0.5 rounded-full text-[9px] font-bold shadow-sm";

            if(activeKey && !isSubmitting) {
                document.getElementById('currentWeekDisp').innerText = `📅 ${getCurrentAcademicWeek()}`;
                renderStudents(false);
            }
        }, () => {
            document.getElementById('syncBadge').innerText = "غير متصل ❌";
            document.getElementById('syncBadge').className = "bg-red-700 text-white px-2.5 py-0.5 rounded-full text-[9px] font-bold shadow-sm";
        });

        function login() {
            const rawEmail = document.getElementById('lEmail').value.trim();
            const pass = document.getElementById('lPass').value.trim();

            if(!rawEmail || !pass) {
                alert('يرجى كتابة البريد الجامعي وكلمة المرور');
                return;
            }

            const key = safeKey(rawEmail);
            if(!db.teachers) db.teachers = {};

            let teacherObj = db.teachers[key] || db.teachers[rawEmail.toLowerCase()];

            if(!teacherObj) {
                for(let k in db.teachers) {
                    if(db.teachers[k].email && db.teachers[k].email.toLowerCase() === rawEmail.toLowerCase()) {
                        teacherObj = db.teachers[k];
                        activeKey = k;
                        break;
                    }
                }
            } else {
                activeKey = key;
            }

            if(teacherObj && teacherObj.password === pass) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboardScreen').classList.remove('hidden');
                document.getElementById('submitWrap').classList.remove('hidden');
                document.getElementById('tNameDisp').innerText = teacherObj.name;
                document.getElementById('currentWeekDisp').innerText = `📅 ${getCurrentAcademicWeek()}`;
                
                populateLecturesDropdown();
            } else {
                alert('البيانات غير صحيحة أو لم يقم المشرف بإنشاء حسابك بعد');
            }
        }

        function populateLecturesDropdown() {
            const teacherObj = db.teachers[activeKey];
            const lecs = teacherObj ? normalizeArray(teacherObj.lectures) : [];
            if(lecs.length === 0) {
                document.getElementById('lecSelect').innerHTML = `<option value="">لا توجد محاضرات مسندة لك حالياً</option>`;
                return;
            }

            let sel = document.getElementById('lecSelect');
            sel.innerHTML = lecs.map((l, i) => `
                <option value="${i}">[${l.day || 'يوم'}] ${l.subject} (${normalizeStage(l.stage)} | شعبة ${l.group} - ${l.study || 'صباحي'}) - ${l.time}</option>
            `).join('');
            
            onLectureChange();
        }

        function onLectureChange() {
            const lecIdx = document.getElementById('lecSelect').value;
            const teacherObj = db.teachers[activeKey];
            const lecs = teacherObj ? normalizeArray(teacherObj.lectures) : [];
            if(!lecs[lecIdx]) return;
            const lec = lecs[lecIdx];

            let subCont = document.getElementById('subGroupsContainer');
            let subBtns = document.getElementById('subGroupsButtons');

            if(['A', 'B', 'C', 'D'].includes(lec.group)) {
                subCont.classList.remove('hidden');
                let s1 = lec.group + '1';
                let s2 = lec.group + '2';
                selectedSubGroup = s1;
                subBtns.innerHTML = `
                    <button onclick="selectSubGroup('${s1}')" id="btn_${s1}" class="p-2 rounded-xl font-bold border transition ${selectedSubGroup === s1 ? 'bg-emerald-800 text-white shadow' : 'bg-white/80 text-slate-800'}">شعبة ${s1}</button>
                    <button onclick="selectSubGroup('${s2}')" id="btn_${s2}" class="p-2 rounded-xl font-bold border transition ${selectedSubGroup === s2 ? 'bg-emerald-800 text-white shadow' : 'bg-white/80 text-slate-800'}">شعبة ${s2}</button>
                `;
            } else {
                subCont.classList.add('hidden');
                selectedSubGroup = lec.group;
            }
            renderStudents(true);
        }

        function selectSubGroup(subGrp) {
            selectedSubGroup = subGrp;
            const lecs = normalizeArray(db.teachers[activeKey].lectures);
            let lec = lecs[document.getElementById('lecSelect').value];
            let s1 = lec.group + '1';
            let s2 = lec.group + '2';
            
            let b1 = document.getElementById(`btn_${s1}`);
            let b2 = document.getElementById(`btn_${s2}`);
            if(b1) b1.className = selectedSubGroup === s1 ? "p-2 rounded-xl font-bold border transition bg-emerald-800 text-white shadow" : "p-2 rounded-xl font-bold border transition bg-white/80 text-slate-800";
            if(b2) b2.className = selectedSubGroup === s2 ? "p-2 rounded-xl font-bold border transition bg-emerald-800 text-white shadow" : "p-2 rounded-xl font-bold border transition bg-white/80 text-slate-800";
            
            renderStudents(true);
        }

        function logout() {
            activeKey = "";
            localAttendanceMap = {};
            isSubmitting = false;
            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById('submitWrap').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('lEmail').value = "";
            document.getElementById('lPass').value = "";
        }

        function renderStudents(resetLocalMap = false) {
            if(!activeKey) return;
            const lecIdx = document.getElementById('lecSelect').value;
            const teacherObj = db.teachers[activeKey];
            const lecs = teacherObj ? normalizeArray(teacherObj.lectures) : [];
            if(!lecs[lecIdx]) return;
            
            const lec = lecs[lecIdx];
            const lecStage = normalizeStage(lec.stage);
            const lecStudy = lec.study || 'صباحي';

            document.getElementById('currentDayBadge').innerText = `${lec.day || 'جدول'} (${lecStage})`;
            document.getElementById('activeSubGroupTitle').innerText = `${lecStage} | ${selectedSubGroup} - ${lecStudy}`;

            const allStudents = normalizeArray(db.students);
            // ✅ مطابقة المرحلة + الشعبة + الدراسة بدقة تامة
            currentDisplayedStudents = allStudents.filter(s =>
                normalizeStage(s.stage) === lecStage &&
                s.group === selectedSubGroup &&
                (s.study || 'صباحي') === lecStudy
            );
            document.getElementById('stCount').innerText = currentDisplayedStudents.length;

            if (resetLocalMap) {
                localAttendanceMap = {};
            }
            currentDisplayedStudents.forEach(s => {
                if (!localAttendanceMap[s.id]) {
                    localAttendanceMap[s.id] = 'حاضر';
                }
            });

            let currentWeek = getCurrentAcademicWeek();
            let submissionKey = `${currentWeek}_${selectedSubGroup}`;

            if(!lec.weeklySubmissions) lec.weeklySubmissions = {};
            let isLockedThisWeek = lec.weeklySubmissions[submissionKey] === true;
            let isSystemPaused = db.autoWeekEnabled === false;

            let pausedBanner = document.getElementById('systemPausedBanner');
            if (isSystemPaused) pausedBanner.classList.remove('hidden');
            else pausedBanner.classList.add('hidden');

            let chosenDate = document.getElementById('lectureDateInput').value;
            let holidayBanner = document.getElementById('holidayBanner');
            let isHoliday = false;

            if(db.holidays && db.holidays[chosenDate]) {
                let hol = db.holidays[chosenDate];
                if(hol.group === 'ALL' || hol.group === lec.group || selectedSubGroup.startsWith(hol.group)) {
                    isHoliday = true;
                    holidayBanner.classList.remove('hidden');
                    holidayBanner.innerHTML = `🏖️ هذا اليوم (${chosenDate}) عطلة رسمية:<br><span class="text-xs font-normal">${hol.reason}</span>`;
                } else {
                    holidayBanner.classList.add('hidden');
                }
            } else {
                holidayBanner.classList.add('hidden');
            }

            let list = document.getElementById('stList');
            let submitBtn = document.getElementById('submitBtn');
            let lockNotice = document.getElementById('lockNotice');

            if (isSystemPaused) {
                submitBtn.classList.add('hidden');
                lockNotice.classList.add('hidden');
            } else if(isLockedThisWeek) {
                submitBtn.classList.add('hidden');
                lockNotice.classList.remove('hidden');
                lockNotice.innerHTML = `🔒 تم إرسال (${lecStage} - شعبة ${selectedSubGroup}) لـ (${currentWeek}).<br>⏳ ستُفتح تلقائياً عند بداية الأسبوع القادم أو من لوحة الإشراف.`;
            } else if(isHoliday) {
                submitBtn.classList.add('hidden');
                lockNotice.classList.add('hidden');
            } else {
                submitBtn.classList.remove('hidden');
                lockNotice.classList.add('hidden');
            }

            list.innerHTML = currentDisplayedStudents.map((s) => {
                let currentStatus = localAttendanceMap[s.id] || 'حاضر';
                
                let statusColor = "bg-emerald-100 text-emerald-800";
                if(currentStatus === 'غائب') statusColor = "bg-red-600 text-white shadow-sm";
                if(currentStatus === 'مجاز') statusColor = "bg-amber-500 text-white shadow-sm";

                return `
                    <div class="flex justify-between items-center p-2.5 bg-white/85 rounded-xl border border-white shadow-sm transition hover:bg-white">
                        <span class="font-bold text-slate-800">${s.name}</span>
                        <div class="flex gap-1">
                            <button ${(isLockedThisWeek || isHoliday || isSubmitting || isSystemPaused) ? 'disabled' : ''} onclick="cycleStStatusById('${s.id}')" class="text-xs px-3 py-1 rounded-lg font-bold transition ${statusColor}">
                                ${currentStatus}
                            </button>
                        </div>
                    </div>
                `;
            }).join('') || `<p class="text-center text-slate-500 font-bold p-3">لا يوجد طلاب مسجلون في (${lecStage} - شعبة ${selectedSubGroup} - ${lecStudy})</p>`;
        }

        function cycleStStatusById(studentId) {
            if (isSubmitting || db.autoWeekEnabled === false) return;
            let currentStatus = localAttendanceMap[studentId] || 'حاضر';
            if(currentStatus === 'حاضر') localAttendanceMap[studentId] = 'غائب';
            else if(currentStatus === 'غائب') localAttendanceMap[studentId] = 'مجاز';
            else localAttendanceMap[studentId] = 'حاضر';
            
            renderStudents(false);
        }

        function submitAttendance() {
            if (isSubmitting) return;
            if (db.autoWeekEnabled === false) {
                alert("⛔ استقبال المحاضرات متوقف حالياً من قبل لوحة الإشراف.");
                return;
            }
            const lecIdx = parseInt(document.getElementById('lecSelect').value);
            const teacherObj = db.teachers[activeKey];
            const lecs = teacherObj ? normalizeArray(teacherObj.lectures) : [];
            const lec = lecs[lecIdx];
            if (!lec) return;

            const lecStage = normalizeStage(lec.stage);
            const lecStudy = lec.study || 'صباحي';
            let currentWeek = getCurrentAcademicWeek();
            let submissionKey = `${currentWeek}_${selectedSubGroup}`;

            let lessonHours = getLogHoursBySubject(lec.subject);
            let chosenDate = document.getElementById('lectureDateInput').value || new Date().toISOString().split('T')[0];

            const submitBtn = document.getElementById('submitBtn');
            isSubmitting = true;
            submitBtn.disabled = true;
            submitBtn.innerText = "⏳ جاري الحفظ والإغلاق سحابياً...";

            dbRef.once('value').then((snapshot) => {
                let latestDb = snapshot.val() || {};
                if (latestDb.autoWeekEnabled === false) {
                    isSubmitting = false;
                    submitBtn.disabled = false;
                    submitBtn.innerText = "🚀 إرسال وإغلاق محاضرة هذا الأسبوع";
                    alert("⛔ تم إيقاف استقبال المحاضرات من قبل لوحة الإشراف.");
                    renderStudents(false);
                    return;
                }

                let latestTeachers = latestDb.teachers || {};
                let latestLecs = latestTeachers[activeKey] ? normalizeArray(latestTeachers[activeKey].lectures) : [];

                if (latestLecs[lecIdx] && latestLecs[lecIdx].weeklySubmissions && latestLecs[lecIdx].weeklySubmissions[submissionKey] === true) {
                    isSubmitting = false;
                    submitBtn.disabled = false;
                    submitBtn.innerText = "🚀 إرسال وإغلاق محاضرة هذا الأسبوع";
                    alert("⚠️ تم إرسال هذه المحاضرة مسبقاً!");
                    renderStudents(true);
                    return;
                }

                let rawStudents = latestDb.students || {};
                let updates = {};

                Object.keys(rawStudents).forEach(stKey => {
                    let s = rawStudents[stKey];
                    if (!s) return;
                    // ✅ تحديث غيابات طلاب المرحلة المطابقة للمحاضرة فقط
                    if (normalizeStage(s.stage) === lecStage && s.group === selectedSubGroup && (s.study || 'صباحي') === lecStudy) {
                        let stStatus = localAttendanceMap[s.id] || 'حاضر';
                        let currentLog = normalizeArray(s.attendanceLog);

                        if (stStatus === 'غائب') {
                            currentLog.push({
                                date: chosenDate,
                                day: lec.day || 'محاضرة',
                                week: currentWeek,
                                subject: lec.subject,
                                teacher: teacherObj.name,
                                time: lec.time,
                                status: 'ABSENT'
                            });
                            updates[`students/${stKey}/absenceHours`] = (s.absenceHours || 0) + lessonHours;
                            updates[`students/${stKey}/status`] = 'غائب';
                            updates[`students/${stKey}/attendanceLog`] = currentLog;
                        } else if (stStatus === 'مجاز') {
                            currentLog.push({
                                date: chosenDate,
                                day: lec.day || 'محاضرة',
                                week: currentWeek,
                                subject: lec.subject,
                                teacher: teacherObj.name,
                                time: lec.time,
                                status: 'EXCUSED'
                            });
                            updates[`students/${stKey}/attendanceLog`] = currentLog;
                        }
                    }
                });

                updates[`teachers/${activeKey}/lectures/${lecIdx}/weeklySubmissions/${submissionKey}`] = true;

                dbRef.update(updates).then(() => {
                    isSubmitting = false;
                    submitBtn.disabled = false;
                    submitBtn.innerText = "🚀 إرسال وإغلاق محاضرة هذا الأسبوع";
                    alert(`🚀 تم تسجيل غيابات (${lecStage} - شعبة ${selectedSubGroup}) لمادة (${lec.subject}) بتاريخ (${chosenDate}) بنجاح!`);
                    localAttendanceMap = {};
                    renderStudents(true);
                }).catch((err) => {
                    isSubmitting = false;
                    submitBtn.disabled = false;
                    submitBtn.innerText = "🚀 إرسال وإغلاق محاضرة هذا الأسبوع";
                    alert("❌ فشل الإرسال، يرجى التحقق من اتصال الإنترنت والمحاولة مرة أخرى: " + err.message);
                });
            }).catch((err) => {
                isSubmitting = false;
                submitBtn.disabled = false;
                submitBtn.innerText = "🚀 إرسال وإغلاق محاضرة هذا الأسبوع";
                alert("❌ تعذر الاتصال بالسحابة: " + err.message);
            });
        }
    </script>
</body>
</html>
